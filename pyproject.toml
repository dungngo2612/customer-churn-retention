[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn-retention"
version = "0.1.0"
description = "Customer churn prediction and retention project"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pandas>=2.2,<4",
    "scikit-learn>=1.5,<2",
    "catboost>=1.2,<2",
    "shap>=0.53,<1",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "uvicorn[standard]>=0.30,<1",
    "streamlit>=1.60,<2",
    "psycopg[binary]>=3.3,<4",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["churn_retention*"]
namespaces = false
