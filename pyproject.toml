[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn-retention"
version = "0.1.0"
description = "Customer churn prediction and retention project"
readme = "README.md"
requires-python = ">=3.12,<3.15"

# 1. Các thư viện cốt lõi tối thiểu để chạy API & Data Pipeline (nhẹ, phục vụ production)
dependencies = [
    "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.10,<3",
    "pydantic-settings>=2.2", "sqlalchemy>=2.0.28", "psycopg[binary]>=3.3,<4",
    "alembic>=1.13.1", "boto3>=1.34", "pandas>=2.2,<4", "pyarrow>=15",
    "python-multipart>=0.0.9", "streamlit>=1.60,<2", "plotly>=7.1,<8",
    "numpy>=1.26,<3", "scikit-learn>=1.5,<2",
    "groq>=1.7,<2", "google-genai>=2.34,<3",
    "httpx>=0.28.1,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.1", "pytest-asyncio>=0.23", "ruff>=0.3", "mypy>=1.9", "build>=1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["churn_retention*"]
namespaces = false

# 3. Cấu hình Ruff (Linting & Formatting)
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]

# 4. Cấu hình mypy (Kiểm tra kiểu tĩnh)
[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

# 5. Cấu hình pytest (Kiểm thử tự động)
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]