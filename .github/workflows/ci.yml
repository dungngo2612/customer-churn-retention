name: Continuous Integration

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    # Khởi tạo một dịch vụ PostgreSQL tạm thời trên GitHub Actions để test migration
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: churn_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. Kéo mã nguồn của repo về máy runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Thiết lập môi trường Python
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # 3. Nâng cấp pip và cài đặt dự án kèm nhóm dev
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # 4. Kiểm tra chuẩn code và format bằng Ruff
      - name: Check code formatting and lint with Ruff
        run: |
          ruff check .
          ruff format --check .

      # 5. Kiểm tra kiểu tĩnh với mypy
      - name: Check module import boundaries
        run: |
          pytest tests/test_module_boundaries.py tests/test_llm_only_boundary.py -q

      - name: Type check with mypy
        run: |
          mypy src

      # 6. Chạy migration trên Database PostgreSQL trống để xác nhận schema hợp lệ
      - name: Run Alembic migrations on clean DB
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/churn_db
        run: |
          alembic upgrade head

      # 7. Chạy kiểm thử tự động với Pytest
      - name: Run unit tests with Pytest
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/churn_db
        run: |
          pytest -v

      - name: Build and verify LLM-only distribution
        run: |
          python -m build
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile(next(Path("dist").glob("*.whl"))) as archive:
              names = archive.namelist()
              forbidden = ("churn_retention/ml/training/", "churn_retention/ml/explainability/",
                           "churn_retention/adapters/predictor/", "churn_retention/adapters/model_registry/",
                           "churn_retention/entrypoints/cli/")
              assert not any(name.startswith(forbidden) for name in names)
              assert "churn_retention/dashboard/app.py" in names
              assert "churn_retention/workflows/build_reference_v2.py" in names
          PY
