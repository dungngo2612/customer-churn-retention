version: "3.8"

services:
  # ============================================================================
  # SERVICE 1: TRAINER (Người 1 - CatBoost Training & Model Bundle Export)
  # Chạy bằng: docker compose run --rm train
  # ============================================================================
  train:
    build:
      context: .
      dockerfile: docker/training.Dockerfile
    volumes:
      - ./data:/workspace/data
      - ./artifacts:/workspace/artifacts
      - ./configs:/workspace/configs
    environment:
      - MLFLOW_TRACKING_URI=sqlite:////workspace/mlflow.db
      - PYTHONUNBUFFERED=1
    command: ["--config", "configs/train_config.yaml"]

  # ============================================================================
  # SERVICE 2: DASHBOARD (Người 3 - Streamlit Decision Support System)
  # Chạy bằng: docker compose up dashboard
  # ============================================================================
  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./src:/app/src
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
