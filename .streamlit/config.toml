# Local defaults; the single-admin launcher additionally validates and enforces these.
[server]
address = "127.0.0.1"
headless = true
enableCORS = true
enableXsrfProtection = true
enableStaticServing = false
maxUploadSize = 2
fileWatcherType = "none"

[client]
showErrorDetails = "none"

[browser]
gatherUsageStats = false
