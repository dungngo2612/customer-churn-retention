seed: 42

features:
  numeric_cols:
    - SeniorCitizen
    - tenure
    - MonthlyCharges
    - TotalCharges
  categorical_cols:
    - gender
    - Partner
    - Dependents
    - PhoneService
    - MultipleLines
    - InternetService
    - OnlineSecurity
    - OnlineBackup
    - DeviceProtection
    - TechSupport
    - StreamingTV
    - StreamingMovies
    - Contract
    - PaperlessBilling
    - PaymentMethod
  drop_cols:
    - customerID
  target_col: Churn
  positive_label: "Yes"

models:
  logistic:
    C: 1.0
    max_iter: 1000

  catboost:
    iterations: 200
    depth: 6
    learning_rate: 0.05

mlflow:
  experiment_name: churn-retention
